name: Windows quality

on:
  push:
    branches:
      - candidate/novice-0.8.0-novice.20
  pull_request:
  workflow_dispatch:
    inputs:
      gate:
        description: Run the final full gate or the diagnostic package-only clean gate
        required: true
        type: choice
        default: full
        options:
          - full
          - clean-package

permissions:
  contents: read

env:
  C2C_EXPECTED_CANDIDATE_VERSION: 0.8.0-novice.20
  C2C_EXPECTED_CANDIDATE_SHA256: d30cea14703a313445a8d56d0d8d090a392f2c6282c6a711e2848d1f2d15844c
  C2C_CLEAN_PACKAGE_ONLY: ${{ (github.event_name == 'workflow_dispatch' && inputs.gate == 'clean-package') || (github.event_name == 'push' && contains(github.event.head_commit.message, '[clean-package-only]')) }}

jobs:
  novice-acceptance:
    if: ${{ !(github.event_name == 'push' && (contains(github.event.head_commit.message, '[native-only]') || contains(github.event.head_commit.message, '[matrix-only]'))) }}
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "24"
      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.9
      - name: Install frozen dependencies
        run: bun install --frozen-lockfile
      - name: Build candidate before package-bound novice tests
        run: bun run build
      - name: Run novice fast diagnostics
        if: env.C2C_CLEAN_PACKAGE_ONLY != 'true'
        run: bun test tests/novice-scenarios.test.ts tests/novice-real-upgrade.test.ts tests/novice-simulator.test.ts tests/novice-redaction.test.ts tests/novice-fresh-journey.test.ts tests/novice-upgrade-journey.test.ts tests/novice-daily-use.test.ts tests/novice-recovery.test.ts tests/novice-evidence.test.ts tests/novice-package-matrix.test.ts tests/outbox-retry-scheduler.test.ts tests/properties/novice-actions.property.test.ts tests/properties/novice-lifecycle.property.test.ts --max-concurrency=1
      - name: Run novice restart diagnostics
        if: env.C2C_CLEAN_PACKAGE_ONLY != 'true'
        run: bun test tests/novice-restart.test.ts --max-concurrency=1
      - name: Run native temporary lifecycle gate
        if: env.C2C_CLEAN_PACKAGE_ONLY != 'true'
        continue-on-error: true
        shell: pwsh
        env:
          C2C_NATIVE_LIFECYCLE_REPORT: .tmp/native-lifecycle-status.json
        run: |
          $nodeBin = (Get-Command node -ErrorAction Stop).Source
          $output = @(& pwsh -NoProfile -NonInteractive -File scripts/novice-standard-user-lifecycle.ps1 -NodeBin $nodeBin -ReportPath $env:C2C_NATIVE_LIFECYCLE_REPORT 2>&1)
          $exitCode = $LASTEXITCODE
          $output | ForEach-Object { Write-Host ([string]$_) }
          if (-not (Test-Path -LiteralPath $env:C2C_NATIVE_LIFECYCLE_REPORT)) {
            $fallback = [ordered]@{ schemaVersion=1; verdict='fail'; summary=$null; failure=[ordered]@{stage='workflow_invocation/report_missing';exceptionType='ProcessFailure';code=('exit_'+$exitCode);errno=$null;hResult=$null};cleanup=[ordered]@{attempted=$false;succeeded=$false} }
            New-Item -ItemType Directory -Path (Split-Path $env:C2C_NATIVE_LIFECYCLE_REPORT -Parent) -Force | Out-Null
            $fallback | ConvertTo-Json -Compress -Depth 6 | Set-Content -LiteralPath $env:C2C_NATIVE_LIFECYCLE_REPORT -Encoding utf8
          }
          if ($exitCode -ne 0) {
            $marker = @($output | Where-Object { [string]$_ -like 'NATIVE_LIFECYCLE_FAIL *' } | Select-Object -Last 1)
            $message = if ($marker.Count -eq 1) { [string]$marker[0] } else { 'native_lifecycle_diagnostic_missing' }
            $message = $message.Replace('%','%25').Replace([string][char]13,'%0D').Replace([string][char]10,'%0A')
            Write-Host ('::error::' + $message)
          }
      - name: Upload native lifecycle evidence
        if: always() && hashFiles('.tmp/native-lifecycle-status.json') != ''
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: novice-native-lifecycle-evidence
          path: .tmp/native-lifecycle-status.json
          if-no-files-found: error
          retention-days: 14
      - name: Publish native lifecycle evidence
        if: always()
        shell: pwsh
        run: |
          $output = @(& node scripts/publish-native-lifecycle-evidence.mjs .tmp/native-lifecycle-status.json 2>&1)
          $exitCode = $LASTEXITCODE
          if ($exitCode -eq 0) { $output | ForEach-Object { Write-Host ([string]$_) }; exit 0 }
          $fallback = '{"schemaVersion":1,"verdict":"fail","failure":{"stage":"workflow_publication/process_failure","code":"unavailable"},"cleanup":{"attempted":false,"succeeded":false}}'
          Write-Host ('::error title=Native lifecycle evidence::' + $fallback)
          try { Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Value $fallback -ErrorAction Stop } catch { Write-Host '::error title=Native lifecycle evidence::{"schemaVersion":1,"verdict":"fail","failure":{"stage":"workflow_publication/summary_write","code":"unavailable"},"cleanup":{"attempted":false,"succeeded":false}}' }
          exit 0
      - name: Run thirty repetitions
        if: env.C2C_CLEAN_PACKAGE_ONLY != 'true'
        run: bun run test:novice:30
      - name: Upload novice repetition evidence
        if: env.C2C_CLEAN_PACKAGE_ONLY != 'true' && always() && hashFiles('.tmp/novice-repository-30.json') != ''
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: novice-repetition-evidence
          path: .tmp/novice-repository-30.json
          if-no-files-found: error
          retention-days: 14
      - name: Publish novice repetition evidence
        if: env.C2C_CLEAN_PACKAGE_ONLY != 'true' && always()
        shell: pwsh
        run: |
          $output = @(& node scripts/publish-novice-matrix-evidence.mjs .tmp/novice-repository-30.json 2>&1)
          $exitCode = $LASTEXITCODE
          if ($exitCode -eq 0) { $output | ForEach-Object { Write-Host ([string]$_) }; exit 0 }
          $fallback = '{"schemaVersion":1,"verdict":"fail","failure":{"stage":"workflow_publication/process_failure","code":"unavailable","repetition":null},"cleanup":{"attempted":false,"succeeded":false}}'
          Write-Host ('::error title=Novice matrix evidence::' + $fallback)
          try { Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Value $fallback -ErrorAction Stop } catch { Write-Host '::error title=Novice matrix evidence::{"schemaVersion":1,"verdict":"fail","failure":{"stage":"workflow_publication/summary_write","code":"unavailable","repetition":null},"cleanup":{"attempted":false,"succeeded":false}}' }
          exit 0
      - name: Audit dependencies
        if: env.C2C_CLEAN_PACKAGE_ONLY != 'true'
        env:
          NPM_CONFIG_REGISTRY: https://registry.npmjs.org/
        run: bun audit
      - name: Pack reviewed candidate
        run: bun pm pack --destination .tmp/package
      - name: Verify extracted package and residual evidence
        shell: pwsh
        run: |
          $archive = Get-ChildItem .tmp/package/*.tgz | Select-Object -First 1
          tar -xf $archive.FullName -C .tmp/package
          node scripts/verify-distribution-package.mjs .tmp/package/package
          if ($env:C2C_CLEAN_PACKAGE_ONLY -ne 'true') {
            $report = Get-Content .tmp/novice-repository-30.json -Raw | ConvertFrom-Json
            if (($report.repetitions | Where-Object { $_.counts.residualProcesses -ne 0 }).Count -ne 0) { throw 'residual process evidence' }
          } else { Write-Host '[clean-package-only] repository stability and audit gates are deferred to the required final full run' }
          $sha256 = (Get-FileHash -Algorithm SHA256 -LiteralPath $archive.FullName).Hash.ToLowerInvariant()
          $packageVersion = (Get-Content -LiteralPath .tmp/package/package/package.json -Raw | ConvertFrom-Json).version
          if ($packageVersion -ne $env:C2C_EXPECTED_CANDIDATE_VERSION) { throw 'candidate_version_mismatch' }
          if ($sha256 -ne $env:C2C_EXPECTED_CANDIDATE_SHA256) { throw 'candidate_archive_hash_mismatch' }
          $metadata = [ordered]@{ repositoryCommit = '${{ github.sha }}'; archiveName = $archive.Name; archiveSize = $archive.Length; sha256 = $sha256 }
          $metadata | ConvertTo-Json | Set-Content -LiteralPath .tmp/package/candidate-metadata.json -Encoding utf8
      - name: Upload reviewed package only
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: novice-reviewed-package
          path: |
            .tmp/package/*.tgz
            .tmp/package/candidate-metadata.json
          if-no-files-found: error
          retention-days: 14
      - name: Build supported old package from pinned commit
        shell: pwsh
        run: |
          git worktree add --detach .tmp/old-source 47c2272faf764904a5c8cba903b05b679b20a0cb
          Push-Location .tmp/old-source
          try {
            bun install --frozen-lockfile
            if ($LASTEXITCODE -ne 0) { throw 'old package frozen install failed' }
            bun run build
            if ($LASTEXITCODE -ne 0) { throw 'old package build failed' }
            bun pm pack --destination ../old-package
            if ($LASTEXITCODE -ne 0) { throw 'old package pack failed' }
          } finally { Pop-Location }
          $oldArchive = Get-ChildItem .tmp/old-package/*.tgz | Select-Object -First 1
          $oldMetadata = [ordered]@{ repositoryCommit = '47c2272faf764904a5c8cba903b05b679b20a0cb'; version = '0.8.0-orchestrator.4'; archiveName = $oldArchive.Name; archiveSize = $oldArchive.Length; sha256 = (Get-FileHash -Algorithm SHA256 -LiteralPath $oldArchive.FullName).Hash.ToLowerInvariant() }
          $oldMetadata | ConvertTo-Json | Set-Content -LiteralPath .tmp/old-package/old-metadata.json -Encoding utf8
      - name: Upload supported old package
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: novice-supported-old-package
          path: |
            .tmp/old-package/*.tgz
            .tmp/old-package/old-metadata.json
          if-no-files-found: error
          retention-days: 14

  native-lifecycle-diagnostic:
    if: ${{ github.event_name == 'push' && contains(github.event.head_commit.message, '[native-only]') }}
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "24"
      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.9
      - name: Install frozen dependencies
        run: bun install --frozen-lockfile
      - name: Build candidate
        run: bun run build
      - name: Run native temporary lifecycle diagnostic
        continue-on-error: true
        shell: pwsh
        env:
          C2C_NATIVE_LIFECYCLE_REPORT: .tmp/native-lifecycle-status.json
        run: |
          $nodeBin = (Get-Command node -ErrorAction Stop).Source
          & pwsh -NoProfile -NonInteractive -File scripts/novice-standard-user-lifecycle.ps1 -NodeBin $nodeBin -ReportPath $env:C2C_NATIVE_LIFECYCLE_REPORT
          $exitCode = $LASTEXITCODE
          if (-not (Test-Path -LiteralPath $env:C2C_NATIVE_LIFECYCLE_REPORT)) {
            $fallback = [ordered]@{ schemaVersion=1; verdict='fail'; summary=$null; failure=[ordered]@{stage='workflow_invocation/report_missing';exceptionType='ProcessFailure';code=('exit_'+$exitCode);errno=$null;hResult=$null};cleanup=[ordered]@{attempted=$false;succeeded=$false} }
            New-Item -ItemType Directory -Path (Split-Path $env:C2C_NATIVE_LIFECYCLE_REPORT -Parent) -Force | Out-Null
            $fallback | ConvertTo-Json -Compress -Depth 6 | Set-Content -LiteralPath $env:C2C_NATIVE_LIFECYCLE_REPORT -Encoding utf8
          }
      - name: Upload native lifecycle diagnostic
        if: always() && hashFiles('.tmp/native-lifecycle-status.json') != ''
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: novice-native-lifecycle-diagnostic
          path: .tmp/native-lifecycle-status.json
          if-no-files-found: error
          retention-days: 14
      - name: Publish native lifecycle diagnostic
        if: always()
        shell: pwsh
        run: |
          $output = @(& node scripts/publish-native-lifecycle-evidence.mjs .tmp/native-lifecycle-status.json 2>&1)
          $exitCode = $LASTEXITCODE
          if ($exitCode -eq 0) { $output | ForEach-Object { Write-Host ([string]$_) }; exit 0 }
          $fallback = '{"schemaVersion":1,"verdict":"fail","failure":{"stage":"workflow_publication/process_failure","code":"unavailable"},"cleanup":{"attempted":false,"succeeded":false}}'
          Write-Host ('::error title=Native lifecycle evidence::' + $fallback)
          try { Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Value $fallback -ErrorAction Stop } catch { Write-Host '::error title=Native lifecycle evidence::{"schemaVersion":1,"verdict":"fail","failure":{"stage":"workflow_publication/summary_write","code":"unavailable"},"cleanup":{"attempted":false,"succeeded":false}}' }
          exit 0

  matrix-repetition-diagnostic:
    if: ${{ github.event_name == 'push' && contains(github.event.head_commit.message, '[matrix-only]') }}
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "24"
      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.9
      - name: Install frozen dependencies
        run: bun install --frozen-lockfile
      - name: Build candidate
        run: bun run build
      - name: Run one matrix repetition diagnostic
        id: matrix
        continue-on-error: true
        run: bun scripts/run-novice-matrix.mjs --repetitions 1 --report .tmp/novice-repository-one.json
      - name: Upload one matrix repetition diagnostic
        if: always() && hashFiles('.tmp/novice-repository-one.json') != ''
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: novice-matrix-one-evidence
          path: .tmp/novice-repository-one.json
          if-no-files-found: error
          retention-days: 14
      - name: Publish one matrix repetition diagnostic
        if: always() && steps.matrix.outcome == 'failure'
        run: node scripts/publish-novice-matrix-evidence.mjs .tmp/novice-repository-one.json
      - name: Enforce one matrix repetition diagnostic
        if: always()
        shell: pwsh
        run: |
          if (-not (Test-Path -LiteralPath .tmp/novice-repository-one.json)) { throw 'matrix_diagnostic_failed' }
          $report = Get-Content -LiteralPath .tmp/novice-repository-one.json -Raw | ConvertFrom-Json
          if ($report.schemaVersion -ne 5 -or @($report.repetitions).Count -ne 1 -or @($report.repetitions | Where-Object verdict -NE 'pass').Count -ne 0) { throw 'matrix_diagnostic_failed' }

  clean-package-acceptance:
    needs: novice-acceptance
    runs-on: windows-latest
    permissions:
      contents: none
    steps:
      - name: Initialize fail-closed clean-run evidence
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path candidate -Force | Out-Null
          [ordered]@{ verdict = 'fail'; failureCode = 'job_incomplete'; failureStage = 'unavailable'; failureDetailCode = 'unavailable'; reportPresent = $false; cleanupComplete = $false } | ConvertTo-Json | Set-Content -LiteralPath candidate/clean-run-status.json -Encoding utf8
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "24"
          package-manager-cache: false
      - name: Set up Bun for version evidence
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.9
      - name: Download reviewed package without repository checkout
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: novice-reviewed-package
          path: candidate
      - name: Download supported old package without repository checkout
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: novice-supported-old-package
          path: old-package
      - name: Run package-only clean Windows novice acceptance
        shell: pwsh
        env:
          C2C_RUNNER_ENVIRONMENT: ${{ runner.environment }}
        run: |
          $environmentRoot = Join-Path $env:RUNNER_TEMP 'novice-owned-environment'
          $ownedRoot = $environmentRoot
          $report = Join-Path $env:RUNNER_TEMP 'novice-clean-evidence.json'
          $runStatus = Join-Path $PWD 'candidate/clean-run-status.json'
          $proofPath = Join-Path $PWD 'candidate/zero-residual-proof.json'
          $env:CHAT2CODEX_NOVICE_ISOLATION = '1'
          $runIdentity = 'github-' + '${{ github.run_id }}' + '-' + '${{ github.run_attempt }}'
          $env:CHAT2CODEX_NOVICE_ENVIRONMENT_ROOT = $environmentRoot
          $env:CHAT2CODEX_NOVICE_RUN_IDENTITY = $runIdentity
          $failureCode = $null
          $failureStage = $null
          $failureDetailCode = $null
          try {
            $metadata = Get-Content -LiteralPath candidate/candidate-metadata.json -Raw | ConvertFrom-Json
            $archive = Get-Item -LiteralPath (Join-Path candidate $metadata.archiveName)
            $oldMetadata = Get-Content -LiteralPath old-package/old-metadata.json -Raw | ConvertFrom-Json
            $oldArchive = Get-Item -LiteralPath (Join-Path old-package $oldMetadata.archiveName)
            if ($archive.Length -ne $metadata.archiveSize) { throw 'archive_size_mismatch' }
            if ((Get-FileHash -Algorithm SHA256 -LiteralPath $archive.FullName).Hash.ToLowerInvariant() -ne $metadata.sha256) { throw 'archive_hash_mismatch' }
            if ((Get-FileHash -Algorithm SHA256 -LiteralPath $oldArchive.FullName).Hash.ToLowerInvariant() -ne $oldMetadata.sha256) { throw 'old_archive_hash_mismatch' }
            New-Item -ItemType Directory -Path candidate/extracted | Out-Null
            tar -xf $archive.FullName -C candidate/extracted
            if ($LASTEXITCODE -ne 0) { throw 'candidate_extract_failed' }
            node candidate/extracted/package/scripts/verify-distribution-package.mjs candidate/extracted/package
            if ($LASTEXITCODE -ne 0) { throw 'candidate_package_invalid' }
            $npmRoot = Join-Path $env:RUNNER_TEMP 'novice-codex-cli'
            npm install --ignore-scripts --no-audit --no-fund --prefix $npmRoot '@openai/codex@0.146.0'
            if ($LASTEXITCODE -ne 0) { throw 'codex_cli_install_failed' }
            $codexBin = Get-ChildItem -LiteralPath (Join-Path $npmRoot 'node_modules/@openai') -Recurse -File | Where-Object Name -EQ 'codex.exe' | Select-Object -First 1
            if (-not $codexBin) { throw 'codex_cli_binary_missing' }
            $env:Path = $codexBin.DirectoryName + ';' + $env:Path
            $acceptanceOutput = @(& node candidate/extracted/package/scripts/run-novice-acceptance.mjs --archive $archive.FullName --sha256 $metadata.sha256 --old-archive $oldArchive.FullName --old-sha256 $oldMetadata.sha256 --old-version $oldMetadata.version --old-commit $oldMetadata.repositoryCommit --owned-root $ownedRoot --environment-root $environmentRoot --production-root (Join-Path $env:RUNNER_TEMP 'excluded-production') --environment-kind equivalent_isolated_windows --fresh-profile --repository-absent --prior-package-absent --repository-commit $metadata.repositoryCommit --run-identity $runIdentity --codex-bin $codexBin.FullName --report $report --cleanup 2>&1)
            $acceptanceExit = $LASTEXITCODE
            if ($acceptanceExit -ne 0) {
              $acceptanceText = ($acceptanceOutput | ForEach-Object { [string]$_ }) -join "`n"
              $failureMarker = @($acceptanceOutput | Where-Object { [string]$_ -like 'NOVICE_CLEAN_WINDOWS_FAILURE *' } | Select-Object -Last 1)
              if ($failureMarker.Count -eq 1) {
                try {
                  $bounded = ([string]$failureMarker[0]).Substring('NOVICE_CLEAN_WINDOWS_FAILURE '.Length) | ConvertFrom-Json
                  $allowedStages = @('root_create','state_seed','task_precheck','install_1','keys_1','another_user_acl','install_2','installed_hashes','start_1','doctor','stop_1','start_2','restart_identity','stop_2','uninstall_1','uninstall_2','task_absent_1','state_preserved','install_3','keys_2','key_rotation','uninstall_3','task_absent_2','protected_checks','owned_root_cleanup','attestation_build','unavailable')
                  $allowedDetailCodes = @('failed','exit_86','unavailable')
                  if ($bounded.schemaVersion -eq 1 -and $allowedStages -contains [string]$bounded.stage -and $allowedDetailCodes -contains [string]$bounded.code) { $failureStage = [string]$bounded.stage; $failureDetailCode = [string]$bounded.code }
                } catch {}
              }
              if ($acceptanceText -like '*Scheduled Task readiness deadline exceeded*') { throw 'attestation_task_readiness' }
              if ($acceptanceText -like '*Another-interactive-user ACL denial probe failed*') { throw 'attestation_another_user_acl' }
              if ($acceptanceText -like '*Attestation owned root remained after cleanup*') { throw 'attestation_owned_root_cleanup' }
              if ($acceptanceText -like '*Integrated clean Windows lifecycle attestation failed*') { throw 'attestation_lifecycle_failed' }
              throw 'novice_acceptance_failed'
            }
            node candidate/extracted/package/scripts/verify-novice-evidence.mjs --external $report
            if ($LASTEXITCODE -ne 0) { throw 'novice_evidence_invalid' }
            Copy-Item -LiteralPath $report -Destination candidate/novice-clean-evidence.json
          } catch {
            $failureCode = if ($_.Exception.Message -match '^[a-z0-9_]+$') { $_.Exception.Message } else { 'clean_package_acceptance_failed' }
            throw
          } finally {
            [ordered]@{ verdict = if ($failureCode) { 'fail' } else { 'pass' }; failureCode = $failureCode; failureStage = if ($failureStage) { $failureStage } else { 'unavailable' }; failureDetailCode = if ($failureDetailCode) { $failureDetailCode } else { 'unavailable' }; reportPresent = Test-Path -LiteralPath $report; cleanupComplete = $false } | ConvertTo-Json | Set-Content -LiteralPath $runStatus -Encoding utf8
          }
      - name: Finalize exact owned cleanup and zero-residual proof
        if: always()
        shell: pwsh
        run: |
          $environmentRoot = Join-Path $env:RUNNER_TEMP 'novice-owned-environment'
          $ownedRoot = $environmentRoot
          $report = Join-Path $env:RUNNER_TEMP 'novice-clean-evidence.json'
          $runStatus = Join-Path $PWD 'candidate/clean-run-status.json'
          $proofPath = Join-Path $PWD 'candidate/zero-residual-proof.json'
          $taskName = 'Chat2Codex-Novice-' + '${{ github.sha }}'.Substring(0, 8)
          $hasher = [Security.Cryptography.SHA256]::Create()
          try { $userHash = ([BitConverter]::ToString($hasher.ComputeHash([Text.Encoding]::UTF8.GetBytes($taskName)))).Replace('-', '').ToLowerInvariant() } finally { $hasher.Dispose() }
          $userName = 'C2CN' + $userHash.Substring(0, 8)
          $taskPath = '\Chat2Codex\' + $taskName
          $cleanupErrors = [Collections.Generic.List[string]]::new()
          try { $deleteTask = Start-Process -FilePath schtasks.exe -ArgumentList @('/Delete', '/TN', $taskPath, '/F') -Wait -PassThru -WindowStyle Hidden } catch { $cleanupErrors.Add('clean_package_task_delete_launch_failed') }
          try {
            $existingUsers = @(Get-LocalUser -ErrorAction Stop | Where-Object Name -EQ $userName)
            if ($existingUsers.Count -gt 1) { throw 'ambiguous cleanup user' }
            if ($existingUsers.Count -eq 1) { Remove-LocalUser -Name $userName -ErrorAction Stop }
          } catch { $cleanupErrors.Add('clean_package_user_cleanup_uncertain') }
          $needle = 'novice-owned-environment'
          try {
            $matching = @(Get-CimInstance Win32_Process -ErrorAction Stop | Where-Object { $_.ProcessId -ne $PID -and $_.CommandLine -like ('*' + $needle + '*') })
            foreach ($process in $matching) { Stop-Process -Id $process.ProcessId -Force -ErrorAction Stop }
          } catch { $cleanupErrors.Add('clean_package_process_cleanup_uncertain') }
          try { if (Test-Path -LiteralPath $ownedRoot) { Remove-Item -LiteralPath $ownedRoot -Recurse -Force -ErrorAction Stop } } catch { $cleanupErrors.Add('clean_package_root_cleanup_uncertain') }
          $ownedRootExists = $true
          $environmentRootExists = $true
          $remainingCount = -1
          $residualUserCount = -1
          $residualTask = $true
          try { $ownedRootExists = Test-Path -LiteralPath $ownedRoot -ErrorAction Stop } catch { $cleanupErrors.Add('clean_package_owned_root_query_uncertain') }
          try { $environmentRootExists = Test-Path -LiteralPath $environmentRoot -ErrorAction Stop } catch { $cleanupErrors.Add('clean_package_environment_root_query_uncertain') }
          try { $remainingCount = @(Get-CimInstance Win32_Process -ErrorAction Stop | Where-Object { $_.ProcessId -ne $PID -and $_.CommandLine -like ('*' + $needle + '*') }).Count } catch { $cleanupErrors.Add('clean_package_process_query_uncertain') }
          try { $residualUserCount = @(Get-LocalUser -ErrorAction Stop | Where-Object Name -EQ $userName).Count } catch { $cleanupErrors.Add('clean_package_user_query_uncertain') }
          try {
            $taskList = @(& schtasks.exe @('/Query', '/FO', 'CSV', '/NH') 2>&1)
            $taskListExitCode = $LASTEXITCODE
            if ($taskListExitCode -ne 0) { throw 'task enumeration failed' }
            $taskNames = @($taskList | Where-Object { $_ -is [string] -and $_.Trim() } | ForEach-Object {
              $row = ConvertFrom-Csv -InputObject $_ -Header TaskName, NextRunTime, Status
              if (-not $row.TaskName) { throw 'task enumeration parse failed' }
              $row.TaskName
            })
            $residualTask = @($taskNames | Where-Object { $_ -ieq $taskPath }).Count -gt 0
          } catch { $cleanupErrors.Add('clean_package_task_query_uncertain') }
          $inspectionComplete = $cleanupErrors.Count -eq 0
          $reportHash = if (Test-Path -LiteralPath $report) { (Get-FileHash -Algorithm SHA256 -LiteralPath $report).Hash.ToLowerInvariant() } else { $null }
          $proof = [ordered]@{ InspectionComplete = $inspectionComplete; CleanupErrorCodes = @($cleanupErrors); OwnedRootExists = $ownedRootExists; EnvironmentRootExists = $environmentRootExists; MatchingProcesses = $remainingCount; ResidualTestUsers = $residualUserCount; ResidualTask = $residualTask; ReportSha256 = $reportHash }
          $proof | ConvertTo-Json | Set-Content -LiteralPath $proofPath -Encoding utf8
          $status = Get-Content -LiteralPath $runStatus -Raw | ConvertFrom-Json
          $cleanupComplete = $proof.InspectionComplete -and -not $proof.OwnedRootExists -and -not $proof.EnvironmentRootExists -and $proof.MatchingProcesses -eq 0 -and $proof.ResidualTestUsers -eq 0 -and -not $proof.ResidualTask
          [ordered]@{ verdict = $status.verdict; failureCode = $status.failureCode; failureStage = $status.failureStage; failureDetailCode = $status.failureDetailCode; reportPresent = Test-Path -LiteralPath $report; cleanupComplete = $cleanupComplete } | ConvertTo-Json | Set-Content -LiteralPath $runStatus -Encoding utf8
          if (-not $cleanupComplete) { throw 'clean_package_cleanup_incomplete' }
      - name: Upload redacted clean-package evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: novice-clean-package-evidence
          path: |
            candidate/novice-clean-evidence.json
            candidate/zero-residual-proof.json
            candidate/clean-run-status.json
          if-no-files-found: error
          retention-days: 14
      - name: Publish bounded clean-package evidence
        if: always()
        shell: pwsh
        run: |
          $fallback = [ordered]@{ schemaVersion=1; verdict='fail'; failureCode='clean_package_evidence_unavailable'; failure=[ordered]@{stage='unavailable';code='unavailable'}; cleanup=[ordered]@{ InspectionComplete=$false; CleanupErrorCodes=@('unavailable'); OwnedRootExists=$true; EnvironmentRootExists=$true; MatchingProcesses=-1; ResidualTestUsers=-1; ResidualTask=$true } }
          try {
            $status = Get-Content -LiteralPath candidate/clean-run-status.json -Raw -ErrorAction Stop | ConvertFrom-Json
            $proof = Get-Content -LiteralPath candidate/zero-residual-proof.json -Raw -ErrorAction Stop | ConvertFrom-Json
            $allowed = @('job_incomplete','archive_size_mismatch','archive_hash_mismatch','old_archive_hash_mismatch','candidate_extract_failed','candidate_package_invalid','codex_cli_install_failed','codex_cli_binary_missing','attestation_task_readiness','attestation_another_user_acl','attestation_owned_root_cleanup','attestation_lifecycle_failed','novice_acceptance_failed','novice_evidence_invalid','clean_package_acceptance_failed')
            $failureCode = if ($status.failureCode -and $allowed -contains [string]$status.failureCode) { [string]$status.failureCode } elseif ($status.verdict -eq 'pass') { $null } else { 'clean_package_acceptance_failed' }
            $allowedStages = @('root_create','state_seed','task_precheck','install_1','keys_1','another_user_acl','install_2','installed_hashes','start_1','doctor','stop_1','start_2','restart_identity','stop_2','uninstall_1','uninstall_2','task_absent_1','state_preserved','install_3','keys_2','key_rotation','uninstall_3','task_absent_2','protected_checks','owned_root_cleanup','attestation_build','unavailable')
            $allowedDetailCodes = @('failed','exit_86','unavailable')
            $publicStage = if ($allowedStages -contains [string]$status.failureStage) {[string]$status.failureStage} else {'unavailable'}
            $publicDetailCode = if ($allowedDetailCodes -contains [string]$status.failureDetailCode) {[string]$status.failureDetailCode} else {'unavailable'}
            $public = [ordered]@{ schemaVersion=1; verdict=if ($status.verdict -eq 'pass' -and $status.cleanupComplete) {'pass'} else {'fail'}; failureCode=$failureCode; failure=if ($status.verdict -eq 'pass') {$null} else {[ordered]@{stage=$publicStage;code=$publicDetailCode}}; cleanup=[ordered]@{ InspectionComplete=[bool]$proof.InspectionComplete; CleanupErrorCodes=@($proof.CleanupErrorCodes | ForEach-Object { if ([string]$_ -match '^[a-z0-9_]+$') {[string]$_} else {'unavailable'} }); OwnedRootExists=[bool]$proof.OwnedRootExists; EnvironmentRootExists=[bool]$proof.EnvironmentRootExists; MatchingProcesses=[int]$proof.MatchingProcesses; ResidualTestUsers=[int]$proof.ResidualTestUsers; ResidualTask=[bool]$proof.ResidualTask } }
          } catch { $public = $fallback }
          $json = $public | ConvertTo-Json -Compress -Depth 6
          $escaped = $json.Replace('%','%25').Replace([string][char]13,'%0D').Replace([string][char]10,'%0A')
          $level = if ($public.verdict -eq 'pass') {'notice'} else {'error'}
          Write-Host ('::' + $level + ' title=Clean package evidence::' + $escaped)
          try { Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Value $json -ErrorAction Stop } catch { Write-Host '::error title=Clean package evidence::{"schemaVersion":1,"verdict":"fail","failureCode":"clean_package_summary_write"}' }
          exit 0
