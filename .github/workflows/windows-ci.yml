name: Windows quality

on:
  push:
    branches:
      - main
      - feat/minimal-quality-acceleration
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.9

      - name: Install dependencies without lifecycle scripts
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Validate quality authority and evidence
        run: bun run quality:check

      - name: Run complete repository gate with process evidence
        run: >-
          node scripts/run-test-shard.mjs --name windows-full-check --timeout-ms 180000
          --report .tmp/quality-evidence/windows-full-check.json
          -- bun run check:stable

      - name: Generate deterministic router shards
        shell: pwsh
        run: bun scripts/make-router-shards.mjs tests/message-router.test.ts 8 | Set-Content -LiteralPath .tmp/quality-evidence/router-shards.json -Encoding utf8

      - name: Run all eight router shards with process evidence
        shell: pwsh
        run: |
          $manifest = Get-Content -LiteralPath .tmp/quality-evidence/router-shards.json -Raw | ConvertFrom-Json
          foreach ($shard in $manifest.shards) {
            node scripts/run-test-shard.mjs --name ("windows-router-{0}" -f $shard.index) --timeout-ms 90000 --report (".tmp/quality-evidence/windows-router-{0}.json" -f $shard.index) -- bun test tests/message-router.test.ts --test-name-pattern $shard.pattern
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }

      - name: Run Windows security and wrapper checks
        run: bun run quality:windows

      - name: Upload bounded quality evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-quality-evidence
          path: .tmp/quality-evidence/*.json
          if-no-files-found: error
          retention-days: 14
