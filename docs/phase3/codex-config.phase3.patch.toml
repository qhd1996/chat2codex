# INERT PHASE 3 PATCH. Do not merge into an active config.toml before Task 12 approval.
# This patch deliberately starts disabled and contains paths/key IDs, never token values.

[mcp_servers.chat2codex_desktop_gateway]
command = "<ABSOLUTE_NODE_24_PATH>"
args = ["<ABSOLUTE_PACKAGE_PATH>/dist/desktop-gateway/mcp.js"]
enabled = false

[mcp_servers.chat2codex_desktop_gateway.env]
CHAT2CODEX_DESKTOP_GATEWAY_HOST = "127.0.0.1"
CHAT2CODEX_DESKTOP_GATEWAY_PORT = "<LOOPBACK_PORT>"
CHAT2CODEX_DESKTOP_MCP_TOKEN_FILE = "<ABSOLUTE_OWNER_ONLY_TOKEN_FILE>"
CHAT2CODEX_DESKTOP_MCP_KEY_ID = "<NON_SECRET_KEY_ID>"
CHAT2CODEX_DESKTOP_ROOT_THREAD_ID = "<EXPLICIT_CONCRETE_ROOT_THREAD_ID>"
CHAT2CODEX_DESKTOP_BINDING_ID = "<OPAQUE_BINDING_ID>"
CHAT2CODEX_DESKTOP_OWNER_INSTANCE_ID = "<OPAQUE_DESKTOP_INSTANCE_ID>"
